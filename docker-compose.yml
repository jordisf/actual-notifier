version: '3.8'

# Two services, one image (design §1):
#  - notifier-cron:     existing cron behavior (entrypoint.sh → cron -f), unchanged schedule.
#  - notifier-listener: long-poll Telegram listener (S4 ships src/listener.js;
#                       until then the service is dormant via the guard in its command).
# Both share the same writable data volume (SQLite) and the same :ro src/.env
# mounts. No inbound ports on either service.

x-notifier-base: &notifier-base
  build: .
  restart: unless-stopped
  environment:
    TZ: Europe/Madrid
  volumes:
    - ./src:/app/src:ro
    - ./.env:/app/.env:ro
    - ./data:/app/data
  networks:
    - actual_net

services:
  notifier-cron:
    <<: *notifier-base
    container_name: actual_notifier
    volumes:
      - ./src:/app/src:ro
      - ./crontab.txt:/app/crontab.txt:ro
      - ./.env:/app/.env:ro
      - ./data:/app/data

  notifier-listener:
    <<: *notifier-base
    container_name: notifier_listener
    # Self-detecting command: while src/listener.js does not exist (before S4)
    # the guard logs once and sleeps, keeping the service up quietly — a clean
    # `exit 0` would loop under restart: unless-stopped. Once S4 lands
    # src/listener.js (mounted :ro), the same line execs the listener; no
    # compose edit is needed at that point.
    command: |
      sh -c '
      if [ ! -f /app/src/listener.js ]; then
        echo "listener: src/listener.js not present yet (S4); staying dormant"
        exec sleep infinity
      fi
      exec node /app/src/listener.js'

  # Web configuration panel (specs/001-config-webapp): its own image
  # (Dockerfile.panel), bakes in only the files it needs — not the
  # `./src:/app/src:ro` bind mount the other two services use. `.env` and
  # `crontab.txt` are mounted `:rw` (unlike the other services' `:ro`
  # mounts, left unchanged above) so the panel can persist edits. No
  # published port beyond PANEL_BIND_HOST — defaults to 127.0.0.1 so an
  # accidental omission fails closed to localhost-only (FR-005).
  config-panel:
    build:
      context: .
      dockerfile: Dockerfile.panel
    container_name: actual_notifier_panel
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
      PANEL_PORT: ${PANEL_PORT:-8080}
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:rw
      - ./crontab.txt:/app/crontab.txt:rw
    ports:
      - "${PANEL_BIND_HOST:-127.0.0.1}:${PANEL_PORT:-8080}:${PANEL_PORT:-8080}"
    networks:
      - actual_net

networks:
  actual_net:
    external: true